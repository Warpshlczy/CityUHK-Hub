name: Sync feature into main

# fork 的 PR 在 pull_request 下拿到的是只读 token、也拿不到 secrets，推分支和留言都会 403，
# 所以这里用 pull_request_target。
# 工作流只对仓库自身的分支做 fetch / merge / push，不 checkout 也不执行 PR 里的代码。
#
# 用 GITHUB_TOKEN 推送不会触发 push 事件驱动的 workflow，只有 workflow_dispatch 和
# repository_dispatch 例外，所以推完 main 要显式 dispatch 截图与名单刷新。
#
# 仓库设置前提：Workflow permissions 选 Read and write；
# main / feature 的保护规则要允许 github-actions[bot] 绕过。
on:
  pull_request_target:
    types: [closed]
    branches: [feature]

permissions:
  contents: write
  issues: write
  pull-requests: write
  # 点名触发别的 workflow 需要它
  actions: write

# 多个 PR 连续合并时串行处理，避免同时改两个分支
concurrency:
  group: feature-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: 同步 feature 并合入 main
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 取仓库代码（只取 base 仓库的 main，不取 PR 代码）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 把 main 同步进 feature
        run: |
          git fetch origin main feature
          git checkout -B feature origin/feature
          git merge --no-edit origin/main
          git push origin feature

      - name: 把 feature 合入 main
        run: |
          git checkout main
          git merge --no-edit feature
          git push origin main

      - name: 触发截图与贡献者名单刷新
        # GITHUB_TOKEN 的 push 不会触发工作流，所以这里点名触发，
        # 否则 PR 合并后 README 的截图和头像墙不会更新。
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['main-sync.yml', 'screenshot.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: 'main',
              });
              core.info(`已触发 ${workflow_id}`);
            }

      - name: 在原 PR 下留言
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // 从 PR 改动的 repos/*.md 反推项目 id，把徽章片段直接给到手；失败就少一段提示。
            let badge = '';
            try {
              const files = await github.rest.pulls.listFiles({
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const target = files.data.find(
                (file) =>
                  /^repos\/[^/]+\.md$/.test(file.filename) &&
                  !file.filename.endsWith('/_template.md'),
              );
              if (target) {
                // 合并后文件已在 feature 上，从那里读更稳：fork 的 sha 不在本仓库
                const res = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: target.filename,
                  ref: 'feature',
                });
                const text = Buffer.from(res.data.content, 'base64').toString('utf8');
                const frontmatter = text.match(/^---\s*\n([\s\S]*?)\n---/)?.[1] ?? '';
                const explicitId = frontmatter.match(/^id:\s*["']?([^"'\n]+)["']?\s*$/m)?.[1]?.trim();
                const repoUrl = frontmatter.match(/^repoUrl:\s*["']?([^"'\n]+)["']?\s*$/m)?.[1]?.trim() ?? '';
                // 与 repos-parser 的 slugify 规则保持一致
                const slug = repoUrl
                  .replace(/\.git$/, '')
                  .replace(/\/+$/, '')
                  .split('/')
                  .slice(-2)
                  .join('-')
                  .toLowerCase()
                  .replace(/['"`]/g, '')
                  .replace(/[^a-z0-9\u4e00-\u9fa5.-]+/g, '-')
                  .replace(/-{2,}/g, '-')
                  .replace(/^[-.]+|[-.]+$/g, '')
                  .slice(0, 60)
                  .replace(/[-.]+$/, '');
                const id = explicitId || slug;

                if (id) {
                  badge = [
                    '',
                    '💡 顺手做一件事：把下面这行贴到你的仓库 README，标注它已被 CityUHK Hub 收录 ——',
                    '既是一枚徽章，也能给项目带来一条外链和更多访问。',
                    '',
                    '```',
                    `[![CityUHK Hub](https://cityu-hub.bond/badge/${id}.svg)](https://cityu-hub.bond/project/${id})`,
                    '```',
                    '',
                    `项目页：https://cityu-hub.bond/project/${id}（页底也能一键复制这段）`,
                  ].join('\n');
                }
              }
            } catch (error) {
              core.info(`推导徽章片段失败，跳过：${error.message}`);
            }

            const body = [
              '感谢同学的支持！你的项目已经成功被收录，可以进入网站查看，再次感谢您对CityUHK Hub的贡献🎉',
              '',
              '站点：https://cityu-hub.bond',
              badge,
            ]
              .filter(Boolean)
              .join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

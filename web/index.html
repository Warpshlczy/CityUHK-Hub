<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CityUHK Hub — a navigation site for open-source projects by City University of Hong Kong students. Filter by author, tag, language and category, then jump straight to GitHub."
    />
    <title>CityUHK Hub · CityUHK Open-Source Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首屏前确定主题与语言，避免闪烁：
      // theme: URL ?theme= > localStorage > 默认暗色
      // lang:  URL ?lang= > localStorage > 默认英语
      (function () {
        try {
          var hashQuery = window.location.hash.indexOf('?') >= 0
            ? window.location.hash.slice(window.location.hash.indexOf('?') + 1)
            : '';
          var params = new URLSearchParams(hashQuery || window.location.search);
          var theme = params.get('theme') || window.localStorage.getItem('cityu-hub-theme') || 'dark';
          document.documentElement.classList.toggle('dark', theme !== 'light');

          var lang = params.get('lang') || window.localStorage.getItem('cityu-hub-lang') || 'en';
          if (lang !== 'en' && lang !== 'zh-CN' && lang !== 'zh-TW') lang = 'en';
          document.documentElement.lang = lang;
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
